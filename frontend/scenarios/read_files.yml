# To be used with GreenIT Analysis CLI
- name: Consulter le Drive
  url: http://localhost/
  waitForSelector: .files
  actions:
    - name: Parcourir les dossiers/fichiers
      type: scroll
    - name: Choisir un dossier
      type: click
      element: article
      pageChange: true
      waitForSelector: .files
    - name: Voir la liste des fichiers du dossier
      type: scroll
    - name: Ouvrir un fichier
      type: click
      element: article > a
      pageChange: true
      waitForSelector: .files
    - name: Retourner à l'accueil 
      type: click
      element: li > a
      pageChange: true
      waitForSelector: .plain-link
