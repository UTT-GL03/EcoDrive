# To be used with GreenIT Analysis CLI
- name: Consulter le Drive
  url: http://localhost/
  actions:
    - name: Parcourir les dossiers/fichiers
      type: scroll
    - name: Choisir un fichier/dossier
      type: click
      element: .plain-link
      pageChange: true
      waitForSelector: article > p
    - name: Parcourir un dossier
      type: scroll
    - name: Ouvrir un fichier/dossier
      type: click
      element: .grid:nth-child(1) > article > a
      pageChange: true
      waitForSelector: article > a
    - name: Retourner aux dossier
      type: click
      element: header > a
      pageChange: true
      waitForSelector: main
    - name: Retourner aux titres
      type: click
      element: header
      pageChange: true
      waitForSelector: .grid
    - name: Parcourir un dossier
      type: scroll
    - name: Ouvrir un autre fichier/dossier
      type: click
      element: .grid:nth-child(2) > article > a
      pageChange: true
      waitForSelector: article > a
    - name: Lire l'autre article
      type: scroll
